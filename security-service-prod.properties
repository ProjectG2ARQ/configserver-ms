# ==========================================
# Security Service - Perfil de Producción (prod)
# ==========================================
server.port=${PORT:8082}

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:mysqldb}:${DB_PORT:3306}/${DB_NAME:security_db}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Parámetros JWT para Producción
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:86400000}

# Logs
logging.level.root=WARN
logging.level.ar.edu.unju.fi.arquitecturas=INFO