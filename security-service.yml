server:
  port: 8082

spring:
  application:
    name: security-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/security_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logitrack:
  security:
    issuer: logitrack-security
    audience: logitrack-api
    access-token-ttl: 15m
    clock-skew: 60s
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:classpath:certs/private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public.pem}