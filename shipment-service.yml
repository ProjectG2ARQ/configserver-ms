server:
  port: 8080

spring:
  application:
    name: shipment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shipment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

clients:
  courier:
    base-url: ${COURIER_SERVICE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 3s
  security:
    base-url: ${SECURITY_SERVICE_URL:http://localhost:8082}

logitrack:
  security:
    issuer: logitrack-security
    audience: logitrack-api
    access-token-ttl: 15m
    clock-skew: 60s
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public.pem}